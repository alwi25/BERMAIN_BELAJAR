name: Run AI Telegram Bot

on:
  workflow_dispatch: # Memungkinkan jalankan manual via tab Actions
  schedule:
    - cron: '0 */5 * * *' # Menjaga workflow tetap aktif berkala

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: python main.py
