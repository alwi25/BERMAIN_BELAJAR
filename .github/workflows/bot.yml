name: Run Telegram AI Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: telegram-ai-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Telegram AI Bot (28 Menit per Siklus)
        env:
          TELEGRAM_BOT_TOKEN: "9148476943:AAGzzLXRtSFmxS5qPvPBndBfWssAJm4GvhY"
          AI_BASE_URL: "https://api.y-api.bestvirtualgoods.com/v1"
          AI_API_KEY: "sk-Rhyk1b33vv00Z1uDAvuC9MKNQKarui6lgEJDLTPbXJtnFXa3"
          AI_MODEL: "deepseek/deepseek-v4-flash"
          MAX_RUNTIME_SECONDS: "1680"
        run: python main.py
