name: Run Multi-AI Telegram Bot

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '50 */5 * * *'

concurrency:
  group: multi-ai-telegram-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI requests urllib3 google-genai

      - name: Run Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          ZENMUX_API_KEY: ${{ secrets.ZENMUX_API_KEY }}
          TER_API_KEY: ${{ secrets.TER_API_KEY }}
          BEST_API_KEY: ${{ secrets.BEST_API_KEY }}
          INDO_API_KEY: ${{ secrets.INDO_API_KEY }}
          BEJO_API_KEY: ${{ secrets.BEJO_API_KEY }}
          NOCTA_API_KEY: ${{ secrets.NOCTA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python -u main.py
