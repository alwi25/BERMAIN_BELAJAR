name: Run Nous Hermes Bot

on:
  push:
    branches:
      - main
  workflow_dispatch: # Agar bisa dinyalakan manual lewat tombol
  schedule:
    # Otomatis menyalakan ulang bot setiap 5 jam 50 menit agar jalan terus
    - cron: '50 */5 * * *'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Berhenti rapi di menit 350 sebelum diputus paksa oleh GitHub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyTelegramBotAPI requests

      - name: Run Bot Script
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          python -u main.py
